<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-img">

    <!-- Name and Title -->
    <h1 id="profile-name">PRINCE SINGH KARKI</h1>
    <h2 class="job-title">Software Engineer & Web Developer</h2>

    <!-- Brief Bio -->
    <p class="card-info">
        Passionate about web development,software engineering,and clean code
    </p>

    <!-- Action / Contact Buttons -->
    <div class="links-container">
      <a href="mailto:singhkarkiprince.com" class="card-btn">Email Me</a>
      <a href="https://facebook.com" target="_blank" class="card-btn">facebook</a>
      <a href="https://instagram.com" target="_blank" class="card-btn">instagram</a>
    </div>

  </div>

</body>
</html>
